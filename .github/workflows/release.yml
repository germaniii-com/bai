name: Release

# Cross-compiles the bai single executable for every supported Bun target,
# embeds the web SPA + bundled skills (Bun >= 1.4 `compile.assets`), smoke-tests
# the native linux-x64 binary, and publishes each platform as a per-platform OCI
# artifact on GHCR via ORAS.
#
# Deliberately uses NO `uses:` marketplace actions (matches the midas.germaniii.com
# convention where the `@` action annotations don't work): checkout, toolchain
# install, and publishing are all plain shell steps.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version stamp/tag (default: dev-<shortsha>)"
        type: string
        required: false
      push:
        description: "Push artifacts to GHCR"
        type: boolean
        default: true
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  BUN_VERSION: "1.4.2"
  ORAS_VERSION: "1.3.4"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (manual, token)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global init.defaultBranch master
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout -q "${GITHUB_SHA}"

      - name: Resolve version
        id: vars
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Install Bun (pinned, manual)
        run: |
          set -euo pipefail
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install ORAS (pinned, manual)
        run: |
          set -euo pipefail
          curl -fLO "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          tar -zxf "oras_${ORAS_VERSION}_linux_amd64.tar.gz" oras
          sudo mv oras /usr/local/bin/oras
          rm -f "oras_${ORAS_VERSION}_linux_amd64.tar.gz"

      - name: Verify toolchain
        run: |
          set -euo pipefail
          bun --version
          oras version

      - name: Install dependencies
        run: |
          set -euo pipefail
          bun install --frozen-lockfile || {
            echo "::warning::frozen lockfile rejected; retrying without --frozen-lockfile"
            bun install
          }

      - name: Typecheck
        run: bun run typecheck

      # NOTE: `bun test` is intentionally not a release gate. The suite has a
      # pre-existing, unrelated failure (packages/web/test/components-contract
      # "no raw corner radii…"). Add a separate CI workflow once that is fixed.

      - name: Build web SPA
        run: bun run --filter '@bai/web' build

      - name: Verify SPA build
        run: |
          set -euo pipefail
          test -f packages/web/dist/index.html
          echo "SPA built: packages/web/dist/index.html"

      - name: Cross-compile all targets
        env:
          BAI_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          bun run scripts/compile.ts --release
          ls -lh dist/

      - name: Smoke test native linux-x64 (embedded SPA + skills)
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail

          # 1. Version stamp survived the compile.
          ./dist/bai-linux-x64 --version | grep -q "${VERSION}"

          # 2. The webui is actually embedded (not the "not built yet" hint page).
          tmp="$(mktemp -d)"
          BAI_DATA_DIR="$tmp/data" \
          XDG_CONFIG_HOME="$tmp/config" \
          XDG_STATE_HOME="$tmp/state" \
            ./dist/bai-linux-x64 --web --port 19640 > "$tmp/bai.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          body=""
          for _ in $(seq 1 45); do
            body="$(curl -fsS http://127.0.0.1:19640/ || true)"
            [ -n "$body" ] && break
            sleep 1
          done

          if echo "$body" | grep -q "not built yet"; then
            echo "::error::bai served the 'web UI not built' hint page — SPA was not embedded"
            cat "$tmp/bai.log"
            exit 1
          fi
          echo "$body" | grep -q 'id="root"' || {
            echo "::error::SPA shell not served from the compiled binary"
            cat "$tmp/bai.log"
            exit 1
          }

          # 3. Bundled skills seeded into the isolated config dir on boot.
          test -f "$tmp/config/bai/skills/code-review/SKILL.md" || {
            echo "::error::bundled skills were not seeded"
            cat "$tmp/bai.log"
            exit 1
          }

          echo "smoke test passed: SPA served + bundled skills seeded"

      - name: Stage per-platform GHCR packages
        run: |
          set -euo pipefail
          rm -rf dist/ghcr
          mkdir -p dist/ghcr
          for f in dist/bai-*; do
            [ -f "$f" ] || continue
            target="${f#dist/bai-}"
            target="${target%.exe}"
            d="dist/ghcr/${target}"
            mkdir -p "$d"
            if [[ "$f" == *.exe ]]; then
              cp "$f" "$d/bai.exe"
              chmod 0755 "$d/bai.exe"
            else
              cp "$f" "$d/bai"
              chmod 0755 "$d/bai"
            fi
          done
          find dist/ghcr -type f -ls

      - name: Package release archives
        run: |
          set -euo pipefail
          OUT="$(pwd)/dist/releases"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          for d in dist/ghcr/*/; do
            [ -d "$d" ] || continue
            target="$(basename "$d")"
            if [[ "$target" == windows-* ]]; then
              # zip preserves bai.exe; executability is implicit on Windows
              ( cd "$d" && zip -q "$OUT/bai-${target}.zip" bai.exe )
            else
              # tar.gz records the 0755 mode -> stays executable after download
              tar -czf "$OUT/bai-${target}.tar.gz" -C "$d" bai
            fi
          done
          ( cd "$OUT" && sha256sum ./* > SHA256SUMS )
          ls -lh "$OUT"

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' || github.event.inputs.push == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GH_TOKEN}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push artifacts to GHCR
        if: ${{ github.event_name == 'push' || github.event.inputs.push == 'true' }}
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY,,}"

          # Pre-release/dev versions (containing "-") don't move `latest`.
          if [[ "${VERSION}" == *-* ]]; then
            TAGS="${VERSION}"
          else
            TAGS="${VERSION},latest"
          fi

          for d in dist/ghcr/*/; do
            [ -d "$d" ] || continue
            target="$(basename "$d")"
            ref="ghcr.io/${REPO}/${target}"
            echo "Pushing ${ref}:${TAGS}"
            # Push the directory CONTENTS so the OCI tar layer preserves the
            # Unix executable bit (a single-file push would not).
            ( cd "$d" && oras push \
                --artifact-type "application/vnd.bai.cli.v1+tar" \
                -a "org.opencontainers.image.source=https://github.com/${REPO}" \
                -a "org.opencontainers.image.version=${VERSION}" \
                -a "org.opencontainers.image.revision=${GITHUB_SHA}" \
                -a "org.opencontainers.image.title=bai (${target})" \
                "${ref}:${TAGS}" . )
          done

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          PRERELEASE=""
          [[ "${VERSION}" == *-* ]] && PRERELEASE="--prerelease"
          if ! gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$TAG" \
              --generate-notes \
              ${PRERELEASE}
          fi
          gh release upload "$TAG" dist/releases/* \
            --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          {
            echo "## bai ${VERSION}"
            echo
            if [[ "${{ github.event_name }}" == "push" || "${{ github.event.inputs.push }}" == "true" ]]; then
              echo "Published per-platform OCI artifacts to GHCR:"
              echo
              echo '| Platform | Artifact |'
              echo '| --- | --- |'
              for d in dist/ghcr/*/; do
                [ -d "$d" ] || continue
                target="$(basename "$d")"
                echo "| ${target} | \`ghcr.io/${REPO}/${target}:${VERSION}\` |"
              done
              echo
              if [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
                echo "GitHub Release assets: https://github.com/${REPO}/releases/tag/v${VERSION}"
                echo "(\`bai-<target>.tar.gz\` / \`bai-<target>.zip\`, plus \`SHA256SUMS\`)."
                echo
              fi
              echo '```sh'
              echo "oras pull ghcr.io/${REPO}/linux-x64:${VERSION} -o ./bai"
              echo "chmod +x ./bai/bai"
              echo "./bai/bai --web --open"
              echo '```'
            else
              echo "Build + smoke test only (GHCR push disabled for this run)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
